<section class="home-rule"><div class="home-wrap verification">
  <h2>We check services before you have to go in person.</h2>
  <div class="diagram" role="img" aria-label="A resource goes into our verification framework, which uses community feedback, and comes out as a reliability score and description.">
    <div class="node"><div class="node-art"><div class="building"><svg viewBox="0 0 24 24"><path d="M3 21h18M6 21V5l9-2v18m0-12h4v12M9 8h3m-3 4h3m-3 4h3"/></svg></div></div><b>Resource</b></div>
    <i class="connector"></i>
    <div class="node"><div class="orbit"><div class="shield"><svg viewBox="0 0 24 24"><path d="m12 2 8 3v6c0 5-4 9-8 11-4-2-8-6-8-11V5z"/><path d="m8 11 3 3 5-6"/></svg></div>
      {% for n in '01234' %}<i style="--n:{{ n }}"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></i>{% endfor %}
    </div><b>Verification framework</b><span>Computation + community feedback</span></div>
    <i class="connector"></i>
    <div class="node"><div class="node-art"><div class="score-card"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="43" stroke="var(--border)" stroke-width="9"/><circle cx="50" cy="50" r="43" pathLength="100" stroke-dasharray="{{ score|default:'85' }} 100" transform="rotate(-90 50 50)" stroke-width="9"/><text x="50" y="60" text-anchor="middle">{{ score|default:'85' }}</text></svg><div class="bars"><i></i><i></i><i></i><i></i></div></div></div><b>Score + description</b></div>
  </div>
</div></section>
