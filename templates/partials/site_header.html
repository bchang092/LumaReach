{% load static %}
{% include "partials/brand_styles.html" %}
<style>
  :root{--header-h:72px}
  .site-header{position:sticky;top:0;z-index:1000;height:var(--header-h);box-sizing:border-box;background:var(--brand-bg);border-bottom:1px solid var(--brand-border);font-family:Inter,system-ui,sans-serif}
  .site-header__inner{max-width:1360px;height:100%;margin:auto;padding:0 40px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .site-header__home{display:flex;align-items:center;gap:12px;min-height:44px;text-decoration:none}
  .site-header__icon{display:block;flex:none;width:32px;height:auto}
  .site-header__mark{font:600 17px/1.2 "Space Grotesk",system-ui,sans-serif;color:var(--brand-heading)}
  .site-header__mark small{display:block;margin-top:3px;font:400 12px/1.25 Inter,system-ui,sans-serif;color:var(--brand-muted)}
  .site-header__right,.site-header__nav{display:flex;align-items:center;gap:28px;min-width:0}
  .site-header__nav a{display:flex;align-items:center;min-height:44px;color:var(--brand-body);font:500 15px Inter,system-ui,sans-serif;text-decoration:none;white-space:nowrap}
  .site-header__nav a:hover{color:var(--brand-heading)}.site-header__nav a[aria-current]{color:var(--brand-accent)}
  .site-menu{display:none;height:36px;padding:0 12px;border:0;border-radius:8px;background:none;color:#e8f1f5;font:400 14px "IBM Plex Sans",system-ui,sans-serif;cursor:pointer}.site-menu__caret{display:inline-block;margin-left:6px;transition:transform 120ms ease}.site-menu[aria-expanded="true"] .site-menu__caret{transform:rotate(180deg)}
  .nav-drawer{position:fixed;top:var(--header-h);left:0;right:0;z-index:999;display:flex;flex-direction:column;background:#0c1a25;border-bottom:1px solid rgba(125,211,252,.10);box-shadow:0 18px 44px rgba(0,0,0,.40)}
  .nav-drawer a{display:block;padding:15px 40px;border-top:1px solid rgba(125,211,252,.08);color:#c7dbe5;font:400 15px "IBM Plex Sans",system-ui,sans-serif;text-decoration:none}.nav-drawer a:first-child{border-top:0}.nav-drawer a:hover{background:rgba(125,211,252,.06);color:#fff}.nav-drawer a[aria-current]{color:#35d6c0}.nav-drawer__count{padding:14px 40px;border-top:1px solid rgba(125,211,252,.08);color:#3f5766;font:500 9.5px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.14em}
  @media(max-width:820px){.site-header__inner{padding:0 20px}.site-header__nav{display:none}.site-menu{display:block}}
</style>
<header class="site-header"><div class="site-header__inner">
  <a class="site-header__home" href="{% url 'homepage' %}" aria-label="Home">
    <img class="site-header__icon" src="{% static 'images/lumareach-logo.png' %}" alt="" width="462" height="512">
    <span class="site-header__mark">{{ brand_name }} <small>Formerly {{ former_name }}</small></span>
  </a>
  <div class="site-header__right"><nav class="site-header__nav" aria-label="Primary"><a href="{% url 'resources_map' %}">Map</a><a href="{% url 'intake' %}">Guided Help</a><a href="{% url 'about' %}">About</a><a href="{% url 'community' %}">Feedback</a></nav><button class="site-menu" type="button" aria-expanded="false">Menu<span class="site-menu__caret">⌄</span></button></div>
</div></header>
<script>
  (() => {
    const header=document.querySelector('.site-header'), menu=header?.querySelector('.site-menu'); if(!header||!menu)return;
    const links=[['{% url "resources_map" %}','Map'],['{% url "intake" %}','Guided Help'],['{% url "about" %}','About'],['{% url "community" %}','Feedback']];
    const path=window.location.pathname, current=url=>new URL(url,window.location.origin).pathname===path||(path.startsWith('/features/')&&url.includes('/about'));
    header.querySelectorAll('.site-header__nav a').forEach(link=>{if(current(link.getAttribute('href')))link.setAttribute('aria-current','page')});
    document.addEventListener('DOMContentLoaded',()=>{
      const badge=document.querySelector('#checked-count');
      if(badge) fetch('{% url "resource_count" %}').then(r=>r.ok?r.json():null).then(data=>{
        if(data){badge.lastElementChild.textContent=data.count+' resources checked';badge.hidden=false;}
      }).catch(()=>{});
    });
    const close=()=>{document.querySelector('.nav-drawer')?.remove();menu.setAttribute('aria-expanded','false');};
    const open=()=>{const drawer=document.createElement('nav');drawer.className='nav-drawer';drawer.setAttribute('aria-label','Mobile navigation');drawer.innerHTML=links.map(([url,label])=>`<a href="${url}"${current(url)?' aria-current="page"':''}>${label}</a>`).join('');drawer.querySelectorAll('a').forEach(a=>a.addEventListener('click',close));document.body.append(drawer);menu.setAttribute('aria-expanded','true');};
    menu.addEventListener('click',()=>menu.getAttribute('aria-expanded')==='true'?close():open());
    document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});document.addEventListener('click',e=>{if(!e.target.closest('.site-header,.nav-drawer'))close()});
  })();
</script>
